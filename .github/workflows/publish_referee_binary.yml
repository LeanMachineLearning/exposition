name: Publish Referee Binary

on:
  push:
    branches:
      # This repository's default branch. It read `master` until 2026-07-28, which is a branch that
      # has never existed here, so the workflow had never once run on a push and no downstream
      # project could obtain a binary.
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1

      - name: Package referee binary
        run: ./scripts/package-referee-binary.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: referee-linux-x86_64-${{ github.sha }}
          path: dist/
          retention-days: 90

  release:
    name: Attach Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged binary
        uses: actions/download-artifact@v5
        with:
          name: referee-linux-x86_64-${{ github.sha }}
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `-R` on every call: this job downloads an artifact and never checks the repository out,
          # so `gh` has no git remote to infer the repository from and fails with "not a git
          # repository". Passing it explicitly is cheaper than checking out a source tree the job
          # has no other use for.
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* -R "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
              --verify-tag --generate-notes dist/*
          fi
