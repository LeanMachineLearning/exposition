name = "LMLExposition"
version = "0.1.0"
defaultTargets = ["exposition"]

[leanOptions]
autoImplicit = false

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "main"

# Standalone declaration-dependency analysis: depends on Lean core only, and on nothing else in
# this repo. Kept a separate library so that dependency direction stays enforced by the build.
[[lean_lib]]
name = "LeanDeps"

[[lean_lib]]
name = "LMLExposition"

[[lean_lib]]
name = "Test"
globs = ["Test", "Test.Collect", "Test.Deps", "Test.Extract"]

[[lean_exe]]
name = "exposition"
root = "Main"
supportInterpreter = true
